[package]
name = "rcraft-client"
version = "0.1.0"
edition = "2021"

[dependencies]
rminecraft-protocol = { path = "../rminecraft-protocol" }
rminecraft-world = { path = "../rminecraft-world" }
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.10", features = ["v3", "v4"] }
flate2 = "1.0"
